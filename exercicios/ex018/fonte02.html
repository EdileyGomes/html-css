<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Internas</title>
    <style>
        @font-face {
            font-family: 'Love Larry'; ;
            src: url('love larry ttf.ttf') format('truetype');
            /*
            opentype - otf
            truetype - ttf
            woff - woff
            woff2 - woff2
            embedded-opentype - eot
            truetype - aat
            */
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;

        }
        h1 {
            font-family: 'Love Larry', Times, serif;
            font-size: 3em;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Títulos</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Minima debitis porro culpa ratione non tenetur molestiae, natus ipsum quo laborum rerum harum asperiores dolor fuga quod reprehenderit molestias iure dolorem?</p>
</body>
</html>
