<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula de FORMS</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 94vh;
            background-color: #f0f0f0;
            color: #333;
            padding: 20px;
        }

        h1 {
            margin: 30px;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            background-image: linear-gradient(to right, #4facfe, #00f2fe);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            margin: 20px;
            padding: 10px;
            border-radius: 20px;
            border: none;
        }
        input[type="submit"] {
            margin: 20px;
            padding: 10px;
            background-color: #4dacff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        label {
            text-align: center;
        }
        input[type="submit"]:hover {
            background-color: #3a8cd1;
        }
        input[type="text"]:focus {
            outline: none;
            border: 2px solid #4dacff;
        }
        input[type="text"]:focus::placeholder {
            color: #4dacff;
        }
        input[type="text"]::placeholder {
            color: #999;
        }
        input[type="text"]::placeholder {
            font-style: italic;
        }
        input[type="text"]::placeholder {
            font-size: 14px;
        }
        input[type="text"]::placeholder {
            transition: color 0.3s ease;
        }
        input[type="text"]::placeholder {
            transition: font-size 0.3s ease;
        }
        input[type="text"]::placeholder {
            transition: font-style 0.3s ease;
        }
        input[type="text"]::placeholder {
            transition: text-shadow 0.3s ease;
        }
        input[type="text"]::placeholder {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        input[type="text"]::placeholder {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        input[type="text"]::placeholder {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
        }
        input[type="text"]::placeholder {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        input[type="text"]::placeholder {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
        }
        input[type="text"]::placeholder {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }
        input[type="text"]::placeholder {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        input[type="text"]::placeholder {
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>Meu Primeiro Formulário</h1>
    <form autocomplete="off" method="post" action="cadastro.php">
        <label for="inome">Nome</label> <input type="text" name="nome" id="inome"></p>
        <label for="isobrenome">Sobrenome</label> <input type="text" name="sobrenome " id="isobrenome"></p>
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
</html>
