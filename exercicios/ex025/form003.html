<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required manlength="30" placeholder="Nome Completo" autocomplete="name" >
        </p>
        <p>
            <label for="media">Média:</label>
            <input type="number" name="media" id="imedia" min="0" max="10" required placeholder="Média do Aluno">
        </p>
        <p>
            <label for="mes">Mês</label>
            <input type="month" name="mes" id="imes" value="2025-05" required>
        </p>
        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
