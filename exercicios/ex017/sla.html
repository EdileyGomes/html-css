    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo de Fundo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap');
        body, html {
        font-family: 'Work Sans', sans-serif;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        }

        .video-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        }

        .content {
        z-index: 1;
        color: white;
        text-align: left;
        font-size: 2rem;
        }
        h1 {
            text-shadow: 0px 0px 18px rgb(0, 0, 0);
            font-size: 42px;
            padding: 15px;
            font-family: 'Cal Sans', sans-serif;
            color: aquamarine;
        }    
    </style>
    </head>
    <body>

    <video autoplay muted loop class="video-bg">
        <source src="meu-video.mp4" type="video/mp4">
        Seu navegador não suporta vídeos em HTML5.
    </video>

    <div class="content">
        <h1>Bem-vindo!</h1>
        <p></p>
    </div>

    </body>
    </html>
