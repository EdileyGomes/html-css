<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            display: inline;
            background-color: lightgray;
            height: 300px;
            width: 300px;
            
            border: 10px solid darkslategray;
            
            padding: 10px 10px 10px 10px;
            
            margin: 20px 20px 40px 20px;


            outline: 10px dashed salmon;

        }
        a {
            border: 10px solid red;
            

            padding: 10px;
        }

    </style>
</head>
<body>
    <h1>Exemplo de Caixa BOX-LEVEL</h1>
    <p>Paragrafos também são exemplos de box-level, mas os <a href="#">links, são exemplos de caixas in line level</a>. Vamos ver como tudo isso funciona?</p>
</body>
</html>
