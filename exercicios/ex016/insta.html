    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto com Gradiente</title>
    <style>
        body {
        background-color: #f0f0f0; /* Fundo simples */
        text-align: center;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', serif;
        font-size: 20px;
        padding: 20px;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;

        }

        h1 {
        font-size: 70px;
        background: linear-gradient(to right, #4A63D3 , #B12FAE); /* Gradiente no texto */
        -webkit-background-clip: text; /* Aplica o gradiente no texto */
        color: transparent; /* Torna o texto transparente para o gradiente aparecer */
        font-weight: bolder;
        }
    </style>
    </head>
    <body>
    <h1>Ediley Gomes</h1>
    </body>
    </html>
